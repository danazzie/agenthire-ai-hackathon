spring:
  application:
    name: mutual-stake
  config:
    # Local runs read the repo-root .env (gitignored); deployed runs get real environment variables.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mutualstake}
    username: ${DB_USER:mutualstake}
    password: ${DB_PASSWORD:mutualstake}
  flyway:
    locations: classpath:db/migration

server:
  # Render injects PORT. Locally 8088, because 8080 is commonly taken.
  port: ${PORT:8088}

mutualstake:
  public-url: ${PUBLIC_URL:http://localhost:8088}
  web-url: ${WEB_URL:}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
  verifier:
    # Empty: the pinned Deno in .tools if present, else `deno` on PATH (the Docker image ships it).
    deno-path: ${MUTUALSTAKE_DENO:}
  parties:
    buyer:
      handle: alex
      display-name: Alex's agent
      paypal-email: ${PAYPAL_BUYER_EMAIL:}
    seller:
      handle: maya
      display-name: Maya's agent
      paypal-email: ${PAYPAL_SELLER_EMAIL:}
