# Tests drive the outbox poller and the sweeper by hand, use a fake PayPal, and never read real
# credentials (the main config imports ../.env, so every value that matters is pinned here).
spring:
  http:
    client:
      read-timeout: 2s

mutualstake:
  public-url: http://localhost:8088
  # The deployed screen's origin, so CORS is exercised (ApiTest).
  web-url: https://web.example
  scheduling:
    enabled: false
  agents:
    anthropic-api-key: ""
    timezone: Europe/Istanbul
    # The runner endpoints are tested with this token (RunnerFlowTest); remote mode is switched on per test.
    runner-token: test-runner-token
  paypal:
    client-id: ""
    client-secret: ""
    webhook-id: ""
  parties:
    buyer:
      paypal-email: alex@personal.example.com
    seller:
      paypal-email: maya@personal.example.com
