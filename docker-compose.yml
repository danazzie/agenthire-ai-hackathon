# Local Postgres for the control plane. Local-only credentials, not secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mutualstake
      POSTGRES_USER: mutualstake
      POSTGRES_PASSWORD: mutualstake
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutualstake -d mutualstake"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db:
