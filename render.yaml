# Render Blueprint: the control plane (Docker), the screen (static site) and Postgres.
# Render deploys from main; work lands there through pull requests from v1-build.
#   https://render.com/deploy?repo=https://github.com/danazzie/agenthire-ai-hackathon/tree/main
# or New → Blueprint → this repo → branch main.
# Render asks for every `sync: false` value; none is ever committed.
# After the first deploy, set WEB_URL on the API and VITE_API_URL on the site to each other's
# https://…onrender.com address, then redeploy the site (Vite reads VITE_API_URL at build time).

databases:
  - name: hire-mind-db
    databaseName: mutualstake
    user: mutualstake
    # Basic, 256 MB ($6 a month): unlike the free plan, it does not expire after 30 days.
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    # Only the API reaches it, over Render's private network.
    ipAllowList: []

services:
  - type: web
    name: hire-mind-api
    runtime: docker
    # Starter, 0.5 CPU and 512 MB ($7 a month): unlike the free plan, it never sleeps, so the outbox keeps
    # polling PayPal. The image caps the JVM heap to leave room for the verifier's Deno process.
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      # One private-network connection string instead of five values; DatabaseUrlEnvironment turns it into
      # Spring's JDBC URL and credentials.
      - key: DATABASE_URL
        fromDatabase: { name: hire-mind-db, property: connectionString }
      # Sandbox only: the PayPal client refuses any other base URL.
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SELLER_EMAIL
        sync: false
      # Optional: without it the agents are off and the scripted job still runs. With AGENTS_REMOTE on,
      # the runner holds its own key and this one is used only if you switch back.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Where an agent reads "by 18:00", e.g. Europe/Istanbul. Empty means UTC.
      - key: AGENT_TIMEZONE
        sync: false
      # "true" hands every agent step (drafting, negotiation, the seller's delivery) to the agent runner on Astropods
      # (agent-runner/README.md); empty or false keeps the agents in this service.
      - key: AGENTS_REMOTE
        sync: false
      # The bearer token the runner sends; the same value goes into the Astropods deploy.
      - key: RUNNER_TOKEN
        sync: false
      # The static site's address, the only origin allowed to call the API from a browser.
      - key: WEB_URL
        sync: false

  - type: web
    name: hire-mind-web
    runtime: static
    # Static sites have no compute plan; they are free and reject `plan: free`.
    # Root is web, so Vite's dist is the publish directory. Do not prefix it with web/.
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the static build. The screen also falls back to this URL.
      - key: VITE_API_URL
        value: https://hire-mind-api.onrender.com
