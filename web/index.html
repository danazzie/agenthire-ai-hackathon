<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HireMind: PayPal holds both sides. The test, not a mood, decides who gets paid." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet" />
    <script>
      (function () {
        function ready() { document.documentElement.classList.add('icons-ready') }
        if (!document.fonts || !document.fonts.load) return
        function check() {
          if (document.fonts.check('24px "Material Symbols Outlined"')) ready()
        }
        document.fonts.load('24px "Material Symbols Outlined"').then(check).catch(function () {})
        document.fonts.ready.then(check)
        document.fonts.addEventListener('loadingdone', check)
      })()
    </script>
    <title>HireMind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
